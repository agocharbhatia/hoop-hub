# The deploy command supplies the globally unique app name and matching ORIGIN.
primary_region = "yyz"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[deploy]
  strategy = "immediate"

[build]
  dockerfile = "Dockerfile"
  build-target = "fly-runtime"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  HOOP_HUB_AUTH_MODE = "invite"
  HOOP_HUB_DATA_USE = "public"
  HOOP_HUB_DB_PATH = "/data/hoop-hub.sqlite"
  HOOP_HUB_EXPORT_DIR = "/data/exports"
  HOOP_HUB_BACKUP_DIR = "/data/backups"
  ADDRESS_HEADER = "Fly-Client-IP"
  HOOP_HUB_ENABLE_LIVE_NBA = "1"
  HOOP_HUB_ENABLE_LIVE_PBPSTATS = "0"
  HOOP_HUB_NBA_PUBLIC_DISPLAY_ALLOWED = "0"
  HOOP_HUB_PBPSTATS_PUBLIC_DISPLAY_ALLOWED = "0"
  HOOP_HUB_NBA_TIMEOUT_MS = "15000"
  HOOP_HUB_RESEARCH_PER_DAY = "30"
  HOOP_HUB_RESEARCH_PER_MINUTE = "5"
  HOOP_HUB_CONCURRENT_RESEARCH = "4"
  HOOP_HUB_EXPORTS_PER_DAY = "3"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "hoop_hub_data"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 7
  scheduled_snapshots = true

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
