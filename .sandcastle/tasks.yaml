  - id: nightly_snapshot_reads_and_lazy_planner_cleanup
    title: Make nightly snapshots readable across days and lazily isolate the
      planner route
    summary: >
      Add the storage/read contract that selects the latest stored nightly
      snapshot up to the query date, and lazily instantiate the default planner
      so route tests and tooling stop depending on eager OpenAI imports.
    status: done
    blocked_by: []
    module_scope:
      - raw endpoint cache read semantics
      - data store latest-row lookup
      - query-time endpoint adapter reads
      - query route dependency wiring
    interface_contract:
      - query-time stored reads select the latest matching snapshot where
        snapshot date is less than or equal to the query date
      - public query and trace contracts remain unchanged
      - test dependency injection for /api/query does not eagerly instantiate
        the default planner adapter
    acceptance_criteria:
      - previous-day nightly snapshots can satisfy next-day queries through the
        existing runtime
      - the data store owns latest-snapshot selection semantics for raw cache
        reads
      - /api/query can be imported in tests without eager OpenAI planner
        instantiation
    test_plan:
      - add data-store tests for latest-row lookup across snapshot dates
      - add integration or route-level regression coverage for previous-day
        snapshot reuse
      - add route import or dependency-injection coverage for lazy planner
        creation
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 17
    type: afk
