      subjects are not present.
    status: pending
    blocked_by:
      - planner_runtime_rankings
    module_scope:
      - planner service
      - planner schema
      - query route tests
      - comparison integration path
    interface_contract:
      - comparison asks preserve subject order from the user question
      - compare-without-metric defaults safely to pts
      - incomplete comparison asks return clarification_needed with no executor
        call
    acceptance_criteria:
      - comparison asks execute successfully through /api/query
      - subject order is stable in planned semantic queries
      - incomplete comparison asks return typed clarification_needed
    test_plan:
