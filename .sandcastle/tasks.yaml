tasks:
  - id: unify_semantic_metrics_and_capabilities
    title: Unify Semantic Metrics And Capabilities
    summary: >
      Establish one shared semantic metric and capability contract for the stats
      runtime, expose it through the public capabilities route, and make active
      runtime validation read from the same source of truth.
    status: done
    blocked_by: []
    module_scope:
      - semantic metric registry
      - capability registry
      - public capabilities route
      - semantic query validation
      - planner capability wiring
    interface_contract:
      - public stats tool capabilities expose only supported operations,
        entities, metrics, output modes, seasons, season types, and subject
        rules
      - executor validation and orchestration discovery read from the same
        shared contract
      - internal source variants and raw source fields remain private
    acceptance_criteria:
      - the active runtime uses one shared semantic capability source of truth
      - GET /api/stats/capabilities returns the public tool contract for this
        slice
      - contract tests prove capabilities and executor validation stay aligned
    test_plan:
      - add capability registry contract tests
      - add capabilities route tests
      - add validation tests proving supported lookup boundaries come from the
        shared contract
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 26
    type: afk
  - id: add_team_directory_and_ambiguity_safe_resolution
    title: Add Team Directory And Ambiguity-Safe Resolution
    summary: >
      Add the shared team identity layer and ambiguity-safe resolution behavior
      so team lookups can ground to canonical subjects without guessing.
    status: pending
    blocked_by:
      - unify_semantic_metrics_and_capabilities
    module_scope:
      - team directory snapshot
      - team alias overlay
      - team resolver
      - structured/team trace resolution contract
    interface_contract:
      - team resolution supports canonical names, city names, short names,
        abbreviations, and curated aliases
      - ambiguous team inputs return clarification_needed
      - canonical team identity is reflected in resolvedQuery once grounding is
        proven
    acceptance_criteria:
      - the runtime resolves supported team naming forms to canonical team
        identity
      - ambiguous team inputs do not guess and return typed clarification
        behavior
      - resolver tests lock canonical identity and ambiguity semantics
    test_plan:
      - add team resolver unit tests for exact, alias, and ambiguous cases
      - add contract tests for canonical resolvedQuery behavior
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 27
    type: afk
  - id: upgrade_deterministic_lookup_fixtures_and_bootstrap_sources
    title: Upgrade Deterministic Lookup Fixtures And Bootstrap Sources
