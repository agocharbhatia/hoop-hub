    module_scope:
      - planner service
      - planner schema
      - query route tests
      - semantic executor integration path
    interface_contract:
      - player trend questions plan into canonical metric ids and supported
        semantic filters
      - vague trend asks return clarification_needed with no executor call
      - executor remains the canonical grounding authority
    acceptance_criteria:
      - scoring-language trend asks execute successfully through /api/query
      - last-N window filters are preserved through planning
      - vague trend asks return typed clarification_needed
    test_plan:
      - add deterministic planner tests for scoring inference and missing_metric
      - add /api/query route tests for supported and clarification-needed trend
        asks
    quality_gates:
