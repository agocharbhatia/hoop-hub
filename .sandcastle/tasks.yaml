  - id: ship_structured_player_season_lookup
    title: Ship Structured Player Season Lookup
    summary: >
      Deliver end-to-end lookup/player support on the stats tool contract with
      one-subject validation, canonical player grounding, one-row table output,
      supported-season behavior, warnings, and traces.
    status: pending
    blocked_by:
      - unify_semantic_metrics_and_capabilities
      - upgrade_deterministic_lookup_fixtures_and_bootstrap_sources
      - materialize_lookup_season_source_variants
    module_scope:
      - semantic executor lookup planning
      - player lookup extraction
      - structured route contract
      - trace and provenance behavior
    interface_contract:
      - POST /api/stats/query accepts canonical lookup/player requests
      - lookup/player returns one table row with canonical identity and season
        metadata
      - unsupported metrics, seasons, season types, and empty stored data fail
        honestly
    acceptance_criteria:
      - structured player lookup executes successfully for supported asks
      - canonical resolvedQuery identity and supported season behavior are
        preserved
      - route, executor, and trace tests lock the full player lookup contract
    test_plan:
      - add semantic executor tests for player lookup output and warnings
      - add stats route tests for direct lookup/player requests
      - add trace tests for canonical player lookup provenance
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 30
    type: afk
