tasks:
  - id: planner_runtime_rankings
    title: Establish /api/query planner runtime for player rankings and typed
      unsupported gaps
    summary: >
      Add the new primary natural-language route and planner boundary, but land
      only the supported player-ranking flow plus typed planner-side
      unsupported-gap behavior.
    status: done
    blocked_by: []
    module_scope:
      - planner contracts and schema
      - OpenAI planner adapter
      - planner service
      - query route orchestration
      - trace persistence for planner non-ok responses
    interface_contract:
      - "POST /api/query accepts { question: string }"
      - public response remains StatsQueryResponse
      - POST /api/stats/query remains the direct structured executor route
      - planner outputs a closed validated decision contract before executor
        delegation
    acceptance_criteria:
      - /api/query executes supported player-ranking asks through the semantic
        executor
      - unsupported asks return typed coverage_gap with no executor call
      - planner output is revalidated before executor use
      - planner outages or invalid structured output return server errors
    test_plan:
      - add deterministic planner service tests for planned and coverage-gap
        decisions
      - add /api/query route tests for rankings, unsupported asks, and
        server-error behavior
      - keep existing executor tests green
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 10
    type: afk
  - id: planner_player_trends
