      Replace the skinny deterministic season fixtures with lookup-ready season
      payloads and make cache seeding plus fixture-backed bootstrap consume the
      same supported metric surface.
    status: pending
    blocked_by:
      - unify_semantic_metrics_and_capabilities
    module_scope:
      - deterministic season fixtures
      - semantic cache seed helper
      - fixture bootstrap fetcher
      - lookup data coverage tests
    interface_contract:
      - deterministic data covers the shipped player and team lookup metric
        surface
      - seed and bootstrap fixture paths use the same season payload shapes
      - fixture coverage stays honest to the supported lookup contract
    acceptance_criteria:
      - deterministic fixtures cover the committed lookup metric surface
      - cache seeding and fixture bootstrap read from the same richer payload set
      - tests fail if the supported lookup metric surface drifts from fixture
        support
    test_plan:
      - update deterministic fixture coverage tests
      - add bootstrap fixture parity tests
      - keep default tests fully fixture-backed
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 28
    type: afk
