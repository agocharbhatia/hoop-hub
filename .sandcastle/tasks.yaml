  - id: ship_typed_standings_and_game_contracts_with_honest_non_ok_behavior
    title: Ship Typed Standings And Game Contracts With Honest Non-Ok Behavior
    summary: >
      Expand the shared structured contract, capability surface, validator, and
      honest non-ok trace behavior so `standings/team` and `game/team` are real
      discoverable shapes end-to-end before successful execution support lands.
    status: done
    blocked_by: []
    module_scope:
      - semantic contracts and capability registry
      - structured validator
      - semantic and orchestration trace boundaries
    interface_contract:
      - POST /api/stats/query accepts typed standings and game requests
      - shared capabilities advertise standings/game field ids and new filters
      - non-executing standings/game paths fail honestly with canonical traces
    acceptance_criteria:
      - the shared capability contract exposes `standings/team`, `game/team`,
        `conference`, `division`, `gameStatus`, and result completeness fields
      - structured validation accepts valid standings/game requests and rejects
        invalid subject rules, filters, and field ids
      - the new shapes fail honestly through route and trace boundaries before
        execution support exists
    test_plan:
      - add capability registry and capabilities route tests for the new shapes
      - add structured validator tests for standings/game requests and filters
      - add route and trace tests for honest non-ok behavior on the new shapes
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 44
    type: afk
