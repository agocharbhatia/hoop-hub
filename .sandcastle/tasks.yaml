tasks:
  - id: ship_answer_first_api_query_for_one_tool_result
    title: Ship Answer-First /api/query For One Tool Result
    summary: >
      Replace the current raw structured /api/query response path with an
      answer-first orchestration flow for the narrowest viable path: one planned
      structured tool request, one semantic execution, and one rendered answer
      visible in the app.
    status: done
    blocked_by: []
    module_scope:
      - query route orchestration
      - planner and renderer service boundaries
      - answer response contract
      - app query UI
    interface_contract:
      - POST /api/query returns an answer-first payload instead of raw
        StatsQueryResponse
      - POST /api/stats/query remains the stable single-query structured tool
        contract
      - the one-request path uses separate planning and answer-rendering steps
    acceptance_criteria:
      - supported one-tool-request questions return the new answer-first payload
      - the route delegates actual data execution to the existing semantic
        executor
      - the app renders the returned answer and supporting grounded data
    test_plan:
      - add route contract tests for one-request answer responses
      - add deterministic planner and renderer boundary tests for the one-tool
        path
      - update UI-facing tests or helpers to consume the new answer payload
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 35
    type: afk
  - id: add_honest_orchestration_traces_for_answer_route_requests
    title: Add Honest Orchestration Traces For Answer-Route Requests
    summary: >
      Introduce an orchestration-trace model for answer-route requests so the
      trace API records planned tool requests, executed structured trace
      references, and aggregated source-call data without pretending the whole
      answer had one resolved query.
    status: pending
    blocked_by:
      - ship_answer_first_api_query_for_one_tool_result
    module_scope:
      - answer-route trace contract
      - trace persistence
      - trace route
    interface_contract:
      - answer-route traces expose plannedToolRequests and executed structured
        trace ids
      - GET /api/query-trace/:traceId returns honest orchestration traces for
        /api/query
      - answer-route traces do not expose a fake single resolvedQuery
    acceptance_criteria:
      - answer-route traces persist planned tool requests and structured trace
        references
      - trace reads aggregate the right source-call and freshness data
      - contract tests lock the orchestration-trace payload shape
    test_plan:
      - add /api/query-trace tests for answer-route orchestration traces
      - add persistence tests for planned tool requests and executed trace ids
      - keep existing structured trace tests green
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 36
    type: afk
  - id: generalize_single_request_planning_from_capabilities
    title: Generalize Single-Request Planning From Capabilities
    summary: >
      Replace family-specific single-request planner logic with
      capability-driven planning so any clear question that maps to one
      supported structured query can be answered without adding another
      handwritten natural-language slice.
    status: pending
    blocked_by:
      - ship_answer_first_api_query_for_one_tool_result
    module_scope:
      - query batch planner
      - planning schema and validation
      - capability-driven planning rules
    interface_contract:
      - clear one-request questions map to supported structured tool requests
      - ambiguous asks return clarification_needed with no executor call
      - clear but unsupported asks return coverage_gap with no executor call
    acceptance_criteria:
      - single-request planning uses the published capabilities contract as its
        source of truth
      - supported one-request lookup, ranking, trend, and compare asks plan
        successfully
      - typed non-ok planner behavior stays conservative and explicit
    test_plan:
      - add planner tests for clear supported one-request asks
      - add planner tests for ambiguity and unsupported asks
      - add coverage proving planning derives from shared capabilities
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 37
    type: afk
  - id: add_internal_batched_tool_execution_for_compound_questions
    title: Add Internal Batched Tool Execution For Compound Questions
    summary: >
      Add the new batch planning contract and internal semantic batch executor
      so /api/query can plan and run up to three structured tool requests in one
      answer without introducing a public batch tool route or an open-ended
      agent loop.
    status: pending
    blocked_by:
      - ship_answer_first_api_query_for_one_tool_result
      - generalize_single_request_planning_from_capabilities
    module_scope:
      - batch planning contract
      - semantic batch executor
      - query orchestrator
    interface_contract:
      - /api/query can execute up to three structured tool requests for one
        answer
      - batch execution calls server modules directly instead of route-to-route
        HTTP
      - the existing semantic validator and executor remain the grounding
        authority for each tool request
    acceptance_criteria:
      - compound questions can execute a bounded batch through the new internal
        executor
      - the batch path is fully internal and keeps /api/stats/query unchanged
      - tests lock the new batch planning and execution seam
    test_plan:
      - add batch planner tests for multi-request plans and size limits
      - add semantic batch executor tests for internal execution wiring
      - add route tests for compound-question orchestration
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 38
    type: afk
  - id: deduplicate_normalized_requests_and_keep_batch_policy_tight
    title: Deduplicate Normalized Requests And Keep Batch Policy Tight
    summary: >
      Normalize all planned structured requests through the existing validator
      seam, deduplicate exact normalized equality only, and preserve order for
      non-duplicate requests so execution efficiency does not depend on prompt
      discipline.
    status: pending
    blocked_by:
      - add_internal_batched_tool_execution_for_compound_questions
    module_scope:
      - request normalization
      - exact deduplication
      - batch execution ordering
    interface_contract:
      - planned requests are normalized before equality comparison
      - exact normalized duplicates are removed
      - non-duplicate request order is preserved
    acceptance_criteria:
      - the batch executor removes exact normalized duplicates only
      - order is preserved for distinct requests
      - no fuzzy merging or heuristic request collapsing is introduced
    test_plan:
      - add executor tests for exact normalized deduplication
      - add executor tests for preserved non-duplicate order
      - add negative tests proving fuzzy merges are out of scope
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 39
    type: afk
  - id: return_partial_answers_for_mixed_batch_outcomes
    title: Return Partial Answers For Mixed Batch Outcomes
    summary: >
      Implement the agreed partial-answer policy so /api/query returns ok plus
      warnings when at least one batched tool request succeeds, and returns
      typed non-ok behavior only when no usable tool result exists.
    status: pending
    blocked_by:
      - add_internal_batched_tool_execution_for_compound_questions
      - deduplicate_normalized_requests_and_keep_batch_policy_tight
    module_scope:
      - partial-answer orchestration policy
      - warning aggregation
      - answer-route status handling
    interface_contract:
      - partial answers use top-level status ok plus warnings
      - zero-success valid batches return typed non-ok behavior
      - failed tool requests do not erase successful grounded tool results
    acceptance_criteria:
      - mixed success and failure batches return ok plus warnings
      - zero-success batches do not emit misleading answers
      - route and executor tests lock the mixed-outcome policy
    test_plan:
      - add route tests for mixed success and failure batches
      - add executor tests for warning aggregation and zero-success behavior
      - add answer-path tests for grounded partial responses
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 40
    type: afk
  - id: harden_answer_rendering_and_grounding_surfaces_for_batched_results
    title: Harden Answer Rendering And Grounding Surfaces For Batched Results
    summary: >
      Finish the answer-first runtime by rendering grounded answer text plus
      minimal v1 artifacts across batched tool results while keeping toolResults
      visible in the main payload and usable by the app UI.
    status: pending
    blocked_by:
      - add_honest_orchestration_traces_for_answer_route_requests
      - add_internal_batched_tool_execution_for_compound_questions
      - return_partial_answers_for_mixed_batch_outcomes
    module_scope:
      - answer renderer
      - answer artifact contract
      - app answer presentation
    interface_contract:
      - /api/query returns answer text, minimal artifacts, and raw toolResults
      - v1 artifacts stay limited to table and text_block
      - the UI can surface supporting tables and warnings from the main payload
    acceptance_criteria:
      - batched answers render grounded answer text plus minimal v1 artifacts
      - toolResults remain visible in the answer-route payload
      - UI and route tests lock the multi-result answer presentation contract
    test_plan:
      - add renderer tests for grounded answer shaping from multiple tool results
      - add route tests for answer payload artifacts and toolResults
      - add UI tests for supporting tables and warnings
    quality_gates:
      - bun run check
      - bun run test
      - bun run build
    retry_limit: 2
    attempts: 0
    notes: []
    github_issue: 41
    type: afk
