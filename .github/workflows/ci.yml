name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Check/Test/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Repository hygiene and public documentation links
        run: bun run check:repo

      - name: Type check
        run: bun run check

      - name: Endpoint catalog contract check
        run: bun run check:endpoint-catalog-contracts

      - name: Unit tests
        run: bun run test

      - name: Local grounded-agent evaluations
        run: bun run eval

      - name: Custom-shot video contracts
        run: bun run eval:custom-shots

      - name: Install video runtime for production checks
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: bun run build

      - name: Production HTTP smoke
        run: bun run beta:smoke

  beta-container:
    name: Beta Docker Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build image
        run: docker build --tag hoop-hub-beta:local .
      - name: Check private container persistence and backups
        working-directory: apps/web
        run: bun run beta:container-smoke
