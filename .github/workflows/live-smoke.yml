name: Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-live-smoke:
    name: Web Live Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run live player-resolution smoke
        env:
          HOOP_HUB_DB_PATH: ':memory:'
          HOOP_HUB_ENABLE_LIVE_NBA: '1'
          HOOP_HUB_NBA_TIMEOUT_MS: '15000'
        run: bun run test:live-smoke
