name: Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-live-smoke:
    name: Dynamic Agent Live Eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run dynamic-agent live canary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AGENT_MODEL: ${{ vars.OPENAI_AGENT_MODEL }}
          HOOP_HUB_DB_PATH: ':memory:'
          HOOP_HUB_ENABLE_LIVE_NBA: '1'
          HOOP_HUB_NBA_TIMEOUT_MS: '15000'
          HOOP_HUB_NBA_PROXY_URL: ${{ secrets.HOOP_HUB_NBA_PROXY_URL }}
        run: bun run eval:live -- --repetitions 1 --output eval-results/live-canary

      - name: Upload redacted eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-agent-live-eval-${{ github.run_id }}
          path: apps/web/eval-results/live-canary/
          if-no-files-found: warn
          retention-days: 14
